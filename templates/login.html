{% extends "base.html" %}

{% block title %}Login - advisorAPP{% endblock %}

{% block content %}
<div class="main-container" style="max-width: 480px; margin: 4rem auto;">
    <div class="card" style="padding: 2.5rem 2rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 class="nav-brand" style="justify-content: center; font-size: 1.5rem;">
                advisor<span class="amber">APP</span>
            </h1>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.5rem;">Sign in to access your dashboard</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-input" required autocomplete="username" autofocus>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
                <span class="icon">login</span> Sign In
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
            <p style="color: var(--text-muted); font-size: 0.85rem;">
                Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--accent); text-decoration: none;">Register here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
